def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
	// The Android Gradle plugin is only required when opening the android folder stand-alone.
	// This avoids unnecessary downloads and potential conflicts when the library is included as a
	// module dependency in an application project.
	if (project == rootProject) {
		repositories {
			google()
			mavenCentral()
		}

		dependencies {
			classpath("com.android.tools.build:gradle:8.1.0")
		}
	}
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 28)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 18)
        targetSdkVersion safeExtGet('targetSdkVersion', 28)
        versionCode 1
        versionName "1.0"
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:1.1.0"
  implementation("androidx.credentials:credentials:${safeExtGet('androidCredentialsVersion', '1.6.0')}")
  implementation("androidx.credentials:credentials-play-services-auth:${safeExtGet('androidCredentialsVersion', '1.6.0')}")
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
  implementation "com.facebook.react:react-native:+"
}
